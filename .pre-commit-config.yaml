repos:
  - repo: local
    hooks:
      - id: ruff_format
        name: ruff_format 
        entry: uv run ruff format
        language: system
        types: [python]
        files: "^popsim/"
        exclude: "^popsim/tests/"
      - id: ruff_check
        name: ruff_check
        entry: uv run ruff check --fix
        language: system
        types: [python]
        files: "^popsim/"
        exclude: "^popsim/tests/"